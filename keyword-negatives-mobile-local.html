<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e14">
<title>Negatives — Mobile</title>
<style>
:root{
  --bg:#0a0e14; --panel:#11161f; --panel2:#161d29; --border:#212b3a;
  --text:#d8dee9; --dim:#7d8899; --faint:#4a5568;
  --amber:#f5a623; --amber-dim:#5c421a;
  --green:#3fb950; --red:#f0564f; --blue:#58a6ff; --purple:#bc8cff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--mono);overscroll-behavior:none;position:fixed;inset:0;overflow:hidden;width:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:8px;outline:none}
input:focus,select:focus{border-color:var(--amber)}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}

/* ── Header ── */
.hdr{display:flex;align-items:baseline;gap:8px;padding:10px 14px 8px;border-bottom:1px solid var(--border);flex:none}
.hdr h1{font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--amber)}
.hdr .sub{font-size:11px;color:var(--dim)}

/* ── Panes / tabs ── */
.pane{flex:1;min-height:0;display:none;flex-direction:column}
.pane.on{display:flex}
.tabbar{flex:none;display:flex;border-top:1px solid var(--border);background:var(--panel);padding-bottom:var(--safe-b)}
.tabbar button{flex:1;padding:10px 2px 8px;font-size:11px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px}
.tabbar button.on{color:var(--amber)}
.tabbar .badge{font-size:10px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.tabbar button.on .badge{border-color:var(--amber-dim);color:var(--amber)}

/* ── Toolbar (Select tab) ── */
.toolbar{flex:none;padding:8px 10px;display:flex;gap:6px;border-bottom:1px solid var(--border);align-items:center}
.toolbar input[type=search]{flex:1;min-width:0;padding:9px 10px;font-size:13px;border-radius:9px}
.tbtn{flex:none;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--pan2);background:var(--panel2);color:var(--dim);font-size:12px;min-height:38px}
.tbtn.on{color:var(--amber);border-color:var(--amber-dim)}
.statline{flex:none;padding:5px 12px;font-size:11px;color:var(--dim);border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;overflow-x:auto;white-space:nowrap}
.statline b{color:var(--text);font-weight:600}
.ngactive{color:var(--purple)}
.statbtn{color:var(--dim);font-size:11px;padding:0;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.statbtn b{color:var(--text)}

/* ── Virtual list ── */
.vlist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.vinner{position:relative;width:100%}
.rowcard{position:absolute;left:0;right:0;height:64px;padding:7px 12px 0;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:2px;overflow:hidden;background:var(--bg);
  touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;will-change:transform;z-index:2}
.rowcard:active{background:var(--panel)}
.rowcard.blocked{opacity:.38}
.rowcard.drafted{border-left:3px solid var(--amber);padding-left:9px}
.rowcard.open{background:var(--panel);border-left:3px solid var(--amber);padding-left:9px;border-bottom-color:transparent}
.rowcard.sel{background:#14243c;border-left:3px solid var(--blue);padding-left:9px}
.rc-kw{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-kw .hl{color:var(--amber)}
.rc-meta{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-nums{font-size:10.5px;color:var(--faint);display:flex;gap:10px}
.rc-nums b{color:var(--dim);font-weight:600}
.rc-src{color:var(--blue)}
.swipebg{position:absolute;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:flex-end;padding-right:16px;color:var(--green);font-weight:700;font-size:12.5px;background:#12281a;z-index:1;white-space:nowrap}
.emptymsg{padding:40px 24px;text-align:center;color:var(--dim);font-size:13px;line-height:1.7}

/* ── Inline expansion panel ── */
.exp{position:absolute;left:0;right:0;background:var(--panel);border-left:3px solid var(--amber);border-bottom:1px solid var(--border);padding:7px 10px 8px 8px;z-index:5}
.exp .sh-label{margin:7px 0 4px;font-size:9px}
.exp-meta{font-size:10.5px;color:var(--dim);line-height:1.5;word-break:break-word;padding-right:126px;min-height:30px}
.exp-div{border-top:1px solid var(--border);margin:8px 0 0}
.exp-nav{position:absolute;top:5px;right:8px;display:flex;gap:4px}
.exp-nav button{border:1px solid var(--border);border-radius:7px;background:var(--panel2);color:var(--dim);font-size:13px;padding:3px 10px;min-height:28px}
.exp-nav a{color:var(--blue);font-size:11px;border:1px solid var(--border);border-radius:7px;padding:4px 8px;text-decoration:none;align-self:center}
.exp-actions{display:flex;gap:5px;margin-top:8px}
.exp-actions .abtn{min-height:38px;padding:8px 4px;font-size:12px}
.abtn.skip{color:var(--red);border-color:#4a2321;flex:.65}
.lastchip{border:1px dashed var(--faint);color:var(--purple);border-radius:8px;padding:6px 9px;font-size:11.5px;min-height:32px;flex:none}

/* ── Batch action bar (long-press multi-select) ── */
#batchBar{position:fixed;left:0;right:0;bottom:calc(64px + var(--safe-b));z-index:30;background:var(--panel);border-top:2px solid var(--blue);padding:8px 12px 10px;display:none}
#batchBar.on{display:block}
.bb-top{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);margin-bottom:8px}
.bb-top b{color:var(--blue);font-size:13px}
.bb-top .lnk{color:var(--dim);text-decoration:underline;text-underline-offset:3px;font-size:11.5px}
.bb-top .bbx{margin-left:auto;color:var(--red);font-size:16px;padding:2px 8px}
.bb-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bb-row .tgl{min-height:38px}
.bb-row .abtn{flex:1;min-height:42px;min-width:96px}
.bb-note{color:var(--faint);font-size:10.5px;align-self:center}

/* ── Bottom sheets (ngram / filter / impact) ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--panel);border-top:1px solid var(--border);border-radius:16px 16px 0 0;max-height:88dvh;display:none;flex-direction:column;padding-bottom:calc(var(--safe-b) + 10px)}
.sheet.on{display:flex}
.sheet-grab{flex:none;width:38px;height:4px;border-radius:2px;background:var(--faint);margin:8px auto 4px}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 14px 8px}
.sh-label{font-size:10px;letter-spacing:.09em;color:var(--faint);text-transform:uppercase;margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);font-size:12.5px;min-height:32px;color:var(--text)}
.chip.on{background:var(--amber-dim);border-color:var(--amber);color:var(--amber)}
.chip.mchip{padding:4px 8px;min-height:26px;font-size:11px;color:var(--faint);background:transparent;border-color:#1a2331}
.chip.mchip.on{background:#152c47;border-color:#2b598c;color:var(--blue)}
.chip.all{color:var(--dim);font-style:italic}
.tgl{padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);font-size:12px;color:var(--dim);min-height:32px}
.tgl.sm{width:42px;padding:6px 0;text-align:center;flex:none}
.mini{font-size:10px;color:var(--dim);padding:2px 8px;border:1px solid var(--border);border-radius:6px;min-height:24px;margin-left:6px;text-transform:none;letter-spacing:0}
.tgl.on{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.sh-preview{margin-top:8px;font-size:12px;color:var(--purple);min-height:16px;word-break:break-word}
.abtn{flex:1;padding:12px 8px;border-radius:10px;font-size:13px;font-weight:700;min-height:46px;border:1px solid var(--border);color:var(--dim)}
.abtn.primary{background:var(--amber);color:#141414;border-color:var(--amber)}
.abtn.primary:disabled{background:var(--amber-dim);color:#8a6c2f}
.abtn.match{color:var(--blue);border-color:#1b3a5c}
.abtn.match:disabled{color:#33517a;border-color:#16283f}
.abtn:disabled{cursor:default}

/* ── Ngram / filter sheets ── */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .tgl{flex:none}
.nglist{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.ngchip{padding:7px 11px;border:1px solid var(--border);border-radius:9px;background:var(--panel2);font-size:12px;min-height:36px}
.ngchip small{color:var(--faint);margin-left:5px}
.ngchip.on{border-color:var(--purple);color:var(--purple);background:#2b1d47}

/* ── Impact sheet ── */
.imp-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.imp-table th{font-size:10px;letter-spacing:.07em;color:var(--faint);text-transform:uppercase;text-align:right;padding:5px 6px;border-bottom:1px solid var(--border);font-weight:600}
.imp-table th:first-child,.imp-table td:first-child{text-align:left;padding-left:2px}
.imp-table td{text-align:right;padding:6px;border-bottom:1px solid var(--border);color:var(--text)}
.imp-table tr.pct td{color:var(--amber);border-bottom:none;font-size:11px;padding-top:2px}
.imp-table td.lab{color:var(--dim)}

/* ── Section lists (Files / Negatives / Same Words) ── */
.scrollpane{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(12px + var(--safe-b))}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--border)}
.card-h .name{flex:1;min-width:0;font-weight:700;font-size:12.5px;word-break:break-all}
.card-h .cnt{flex:none;font-size:11px;color:var(--dim)}
.dl{flex:none;padding:7px 11px;border:1px solid var(--amber-dim);color:var(--amber);border-radius:8px;font-size:11.5px;min-height:34px}
.dl:disabled{color:var(--faint);border-color:var(--border)}
.xbtn{flex:none;color:var(--red);font-size:15px;padding:4px 9px;min-height:34px}
.itemrow{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px}
.itemrow:last-child{border-bottom:none}
.itemrow .main{flex:1;min-width:0;word-break:break-word}
.itemrow .kw{font-weight:600}
.itemrow .sub{color:var(--dim);font-size:10.5px}
.tag{font-size:9.5px;padding:1px 6px;border:1px solid var(--border);border-radius:6px;color:var(--dim)}
.tag.ex{color:var(--red);border-color:#4a2321}.tag.ph{color:var(--blue);border-color:#1b3a5c}.tag.br{color:var(--green);border-color:#1e4426}
.more{width:100%;padding:10px;color:var(--dim);font-size:11.5px}
.note{font-size:11px;color:var(--dim);line-height:1.7;padding:4px 2px 12px}
.upl{display:block;border:1px dashed var(--faint);border-radius:12px;padding:22px 14px;text-align:center;color:var(--dim);font-size:13px;margin-bottom:10px}
.upl b{color:var(--amber)}
.upl.repl{padding:13px 14px;border-style:solid;border-color:var(--border)}
.upl.repl b{color:var(--blue)}
.upl input{display:none}
.dangerbtn{color:var(--red);border:1px solid #4a2321;border-radius:9px;padding:9px 12px;font-size:12px;width:100%;min-height:42px}

/* ── Toast (with undo) ── */
#toast{position:fixed;left:50%;bottom:calc(76px + var(--safe-b));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--amber-dim);color:var(--amber);padding:9px 14px;border-radius:10px;font-size:12.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;display:flex;gap:12px;align-items:center}
#toast.on{opacity:1;pointer-events:auto}
#toastUndo{color:var(--blue);font-weight:700;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;display:none}
#toastUndo.on{display:inline}
</style>
</head>
<body>
<div id="app">
  <div class="hdr"><h1>NEGATIVES</h1><span class="sub" id="hdrSub">no files loaded</span></div>

  <!-- SELECT -->
  <div class="pane" id="pane-select">
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search keywords…" autocomplete="off" autocapitalize="off">
      <button class="tbtn" id="btnNgram">N-gram</button>
      <button class="tbtn" id="btnFilter">Filter</button>
    </div>
    <div class="statline" id="statline"></div>
    <div class="vlist" id="vlist"><div class="vinner" id="vinner"></div></div>
  </div>

  <!-- NEGATIVES -->
  <div class="pane" id="pane-negatives"><div class="scrollpane" id="negPane"></div></div>

  <!-- SAME WORDS -->
  <div class="pane" id="pane-same"><div class="scrollpane" id="samePane"></div></div>

  <!-- FILES -->
  <div class="pane" id="pane-files"><div class="scrollpane" id="filesPane"></div></div>

  <div class="tabbar">
    <button data-tab="select" class="on">Select<span class="badge" id="bSelect">0</span></button>
    <button data-tab="negatives">Negatives<span class="badge" id="bNeg">0</span></button>
    <button data-tab="same">Same Words<span class="badge" id="bSame">0</span></button>
    <button data-tab="files">Files<span class="badge" id="bFiles">0</span></button>
  </div>
</div>

<!-- Batch bar: long-press a row to enter multi-select; adds each row's FULL search term -->
<div id="batchBar">
  <div class="bb-top"><b id="bbCount">0</b><span>selected</span>
    <button class="lnk" id="bbAll">all in view</button>
    <button class="bbx" id="bbX">✕</button>
  </div>
  <div class="bb-row">
    <button class="tgl sm" id="bbExact">Ex</button>
    <button class="tgl sm" id="bbPhrase">Ph</button>
    <button class="tgl sm" id="bbCam">Ca</button>
    <button class="tgl sm" id="bbAg">AG</button>
    <button class="abtn primary" id="bbAdd">Add</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<!-- Ngram sheet -->
<div class="sheet" id="ngSheet">
  <div class="sheet-grab"></div>
  <div class="sheet-body">
    <div class="sh-label">N-gram mode</div>
    <div class="seg">
      <button class="tgl" data-ngmode="1">1-gram</button>
      <button class="tgl" data-ngmode="2">2-gram</button>
      <select id="ngSort" style="padding:8px 10px;border-radius:9px;margin-left:auto">
        <option value="impressions">by Impr</option>
        <option value="count">by Count</option>
        <option value="cost">by Cost</option>
        <option value="clicks">by Clicks</option>
        <option value="conversions">by Conv</option>
      </select>
    </div>
    <div class="sh-label">Tap to filter rows (OR logic) <button id="ngClear" style="color:var(--red);font-size:11px;margin-left:8px">clear</button></div>
    <div class="nglist" id="ngList"></div>
  </div>
</div>

<!-- Filter sheet -->
<div class="sheet" id="fltSheet">
  <div class="sheet-grab"></div>
  <div class="sheet-body">
    <div class="sh-label">Source files<button class="mini" id="srcAllBtn">all</button><button class="mini" id="srcNoneBtn">none</button></div>
    <div class="chips" id="fltSrc"></div>
    <div class="sh-label">Accounts<button class="mini" id="acctAllBtn">all</button><button class="mini" id="acctNoneBtn">none</button></div>
    <div class="chips" id="fltAcct"></div>
    <div class="sh-label">Minimum impressions</div>
    <div class="seg" id="fltImpr">
      <button class="tgl" data-minimpr="0">All</button>
      <button class="tgl" data-minimpr="10">≥10</button>
      <button class="tgl" data-minimpr="50">≥50</button>
      <button class="tgl" data-minimpr="100">≥100</button>
      <button class="tgl" data-minimpr="500">≥500</button>
    </div>
    <div class="sh-label">Sort</div>
    <div class="seg" id="fltSort">
      <button class="tgl" data-sort="impr">Impr</button>
      <button class="tgl" data-sort="conv">Conv</button>
      <button class="tgl" data-sort="cost">Cost</button>
      <button class="tgl" data-sort="clicks">Clicks</button>
      <button class="tgl" data-sort="kw">A–Z</button>
    </div>
    <div class="seg" style="margin-top:12px"><button class="tgl" id="fltHideBlocked">Hide blocked</button></div>
    <div style="height:8px"></div>
    <button class="dangerbtn" id="fltReset">Reset all filters</button>
  </div>
</div>

<!-- Impact sheet (excluded-by-negatives summary) -->
<div class="sheet" id="impSheet">
  <div class="sheet-grab"></div>
  <div class="sheet-body" id="impBody"></div>
</div>

<div id="toast"><span id="toastMsg"></span><button id="toastUndo">UNDO</button></div>

<script>
'use strict';
/* ════════════════ CSV parser (quoted fields, CRLF) ════════════════ */
function parseCSVText(text){
  const rows=[]; let row=[], field='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; }
      else field+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); field=''; rows.push(row); row=[]; }
      else if(c==='\r'){ /* skip */ }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  while(rows.length && rows[rows.length-1].every(v=>v==='')) rows.pop();
  if(!rows.length) return [];
  const headers=rows[0].map(h=>h.trim());
  return rows.slice(1).map(r=>{
    const o={};
    for(let i=0;i<headers.length;i++) o[headers[i]]=r[i]??'';
    return o;
  });
}

/* ════════════════ Negatives engine ════════════════
   Google Ads NEGATIVE keyword semantics (negatives never match close
   variants / plurals / misspellings — token match is literal):
   - Exact:  query is exactly the negative's terms, same order, no extras.
   - Phrase: negative's terms appear in the query in the same order,
             contiguous; extra words before/after are allowed.
   - Broad:  EVERY term of the negative appears somewhere in the query,
             in ANY order, NOT necessarily adjacent.                    */
function tokenize(input){ return (input||'').toLowerCase().match(/[a-z0-9]+/g)||[]; }
function tokenCounts(t){ const c={}; for(const x of t) c[x]=(c[x]||0)+1; return c; }
function exactMatch(n,q){ if(n.length!==q.length) return false; for(let i=0;i<n.length;i++) if(n[i]!==q[i]) return false; return true; }
function phraseMatch(n,q){
  if(n.length>q.length) return false;
  for(let s=0;s<=q.length-n.length;s++){ let ok=true; for(let o=0;o<n.length;o++) if(q[s+o]!==n[o]){ok=false;break;} if(ok) return true; }
  return false;
}
function broadMatch(n,q){
  if(n.length>q.length) return false;
  const need=tokenCounts(n), have=tokenCounts(q);
  for(const w in need) if((have[w]||0)<need[w]) return false;
  return true;
}
function matchesNegativeKeyword(neg,query,type){
  const n=tokenize(neg); if(!n.length) return false;
  const q=tokenize(query); if(!q.length) return false;
  const t=(type||'Broad match').toLowerCase();
  if(t==='exact match') return exactMatch(n,q);
  if(t==='phrase match') return phraseMatch(n,q);
  return broadMatch(n,q);
}
const norm=v=>String(v??'').trim().toLowerCase();
/* Blocked = a committed negative would stop THIS search term (query only —
   the Matched Keyword / bid keyword is deliberately not tested).
   Scope: customerId must match; empty campaign = customer-wide,
   empty ad group = campaign-wide. */
function rowBlockedByNegatives(row,negs){
  const q=String(row['Negative keyword']??'').trim();
  if(!q) return false;
  const rc=norm(row['Customer ID']), rcam=norm(row['Campaign']), rag=norm(row['Ad group']);
  return negs.some(neg=>{
    const nc=norm(neg.customerId); if(!nc||nc!==rc) return false;
    const ncam=norm(neg.campaign); if(ncam&&ncam!==rcam) return false;
    const nag=norm(neg.adGroup); if(nag&&nag!==rag) return false;
    return matchesNegativeKeyword(neg.negativeKeyword,q,neg.type);
  });
}
/* Expansion is scoped to rows from the SAME SOURCE FILE only — keeps exports cleanly separated per import. */
function expandNegatives(item,selRow,sameSourceRows){
  const matchLabel=m=>m==='Phrase'?'Phrase match':m==='Exact'?'Exact match':'Broad match';
  const type=matchLabel(item.match), text=item.text, out=[];
  const cid=String(selRow['Customer ID']), camp=selRow['Campaign'], ag=selRow['Ad group'];
  if(item.scope==='CAM'){
    out.push({rowType:'Negative keyword',action:'Add',customerId:cid,campaign:camp,adGroup:'',negativeKeyword:text,type});
  } else if(item.scope==='AG'){
    const pairs=new Set();
    for(const r of sameSourceRows) if(r['Ad group']===ag) pairs.add(String(r['Customer ID'])+'||'+r['Campaign']);
    for(const key of pairs){ const [c,cm]=key.split('||');
      out.push({rowType:'Negative keyword',action:'Add',customerId:c,campaign:cm,adGroup:ag,negativeKeyword:text,type}); }
  } else {
    const camps=new Set();
    for(const r of sameSourceRows) if(String(r['Customer ID'])===cid) camps.add(r['Campaign']);
    for(const cm of camps) out.push({rowType:'Negative keyword',action:'Add',customerId:cid,campaign:cm,adGroup:'',negativeKeyword:text,type});
  }
  return out;
}
function dedupeNegatives(existing,incoming){
  const key=r=>[r.srcId,r.customerId,r.campaign,r.adGroup,r.negativeKeyword,r.type].join('|');
  const seen=new Set(existing.map(key)); const add=[];
  for(const r of incoming){ const k=key(r); if(seen.has(k)) continue; seen.add(k); add.push(r); }
  return add;
}
function buildNgrams(rows,n){
  const data=new Map();
  for(const row of rows){
    const tokens=row._tok; if(tokens.length<n) continue;
    const seen=new Set();
    for(let i=0;i<=tokens.length-n;i++){
      const ng=n===1?tokens[i]:tokens[i]+' '+tokens[i+1];
      if(seen.has(ng)) continue; seen.add(ng);
      let d=data.get(ng);
      if(!d){ d={ngram:ng,count:0,impressions:0,clicks:0,cost:0,conversions:0}; data.set(ng,d); }
      d.count++; d.impressions+=row.impr||0; d.clicks+=row.clicks||0; d.cost+=row.cost||0; d.conversions+=row.conv||0;
    }
  }
  return [...data.values()];
}
function textContainsNgram(tokens,ngTokens){
  if(ngTokens.length===1) return tokens.includes(ngTokens[0]);
  for(let i=0;i<=tokens.length-ngTokens.length;i++){
    let ok=true;
    for(let j=0;j<ngTokens.length;j++) if(tokens[i+j]!==ngTokens[j]){ok=false;break;}
    if(ok) return true;
  }
  return false;
}
const splitWords=v=>(v||'').trim().split(/\s+/).filter(Boolean);
const fmtSamePart=v=>v.trim().split(/\s+/).filter(Boolean).join('_');
function triggerDownload(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
const csvEsc=v=>{ const s=String(v??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };

/* ════════════════ State ════════════════ */
const LS_KEY='neg-mobile-v1';
const S={
  sources:[],            // {id,name,addedAt,rowCount}
  rows:[],               // parsed rows + derived fields
  negatives:[],          // {srcId,customerId,campaign,adGroup,negativeKeyword,type,rowType,action}
  sameWords:[],          // {srcId,left,right}
  drafts:{},             // rowId -> {neg:[],mw:[],match:null,scope:null}
  lastCombo:{match:null,scope:null},   // sticky last-used match/scope (swipe + one-tap reuse)
  ui:{tab:'select',search:'',srcOff:[],acctOff:[],minImpr:0,sort:'impr',dir:'desc',
      ngMode:'1',ngSort:'impressions',activeNgrams:[],hideBlocked:false},
  rowsPersisted:true
};
let srcSeq=1;

const DERIVED=new Set(['_id','_src','_acct','impr','conv','clicks','cost','_kwLower','_tok','_words','_mwords']);
/* Stable fingerprint of the raw CSV columns of a row — drops exact
   duplicate rows across every loaded file (first occurrence wins). */
function rawKey(obj){
  const ks=Object.keys(obj).filter(k=>!DERIVED.has(k)&&k!=='__src').sort();
  return ks.map(k=>k+'\u0001'+String(obj[k]??'')).join('\u0002');
}

function deriveRow(raw,srcId,idx){
  const num=v=>{ if(v==null||v==='') return 0; const n=Number(String(v).replace(/[,$]/g,'')); return isNaN(n)?0:n; };
  const kw=raw['Negative keyword']||'';
  const acct=raw['Account Name']||raw['Account name']||String(raw['Campaign']||'').split('_')[0]||'';
  return {...raw,_id:srcId+'_'+idx,_src:srcId,_acct:acct,
    impr:num(raw['Impressions']??raw['Impr.']??raw['Impr']),
    conv:num(raw['Conversions']??raw['Conv.']??raw['Conv']),
    clicks:num(raw['Clicks']),cost:num(raw['Cost']),
    _kwLower:kw.toLowerCase(),_tok:tokenize(kw),_words:splitWords(kw),
    _mwords:splitWords(raw['Matched Keyword']||'')};
}

/* ════════════════ Persistence ════════════════
   Split store: small meta (negatives, pairs, sources, ui) → localStorage,
   written on every action (cheap). Row data → IndexedDB, written only on
   import / remove / replace — async and non-blocking, with a far larger
   quota than localStorage, so big files survive between sessions and no
   interaction ever re-serializes the whole dataset.
   NO sample data ships in this file — anything visible on load is your
   own previous session restored from this device. */
function idbOpen(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error('no idb'));
    const r=indexedDB.open('neg-mobile-db',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
function idbPut(key,val){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction('kv','readwrite');
    tx.objectStore('kv').put(val,key);
    tx.oncomplete=()=>{db.close();res();};
    tx.onerror=()=>{db.close();rej(tx.error);};
  }));
}
function idbGet(key){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction('kv','readonly');
    const rq=tx.objectStore('kv').get(key);
    rq.onsuccess=()=>{db.close();res(rq.result);};
    rq.onerror=()=>{db.close();rej(rq.error);};
  }));
}
function idbDel(key){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction('kv','readwrite');
    tx.objectStore('kv').delete(key);
    tx.oncomplete=()=>{db.close();res();};
    tx.onerror=()=>{db.close();rej(tx.error);};
  })).catch(()=>{});
}
function save(){ /* meta only — never touches row data */
  try{ localStorage.setItem(LS_KEY,JSON.stringify(
    {sources:S.sources,negatives:S.negatives,sameWords:S.sameWords,ui:S.ui,srcSeq,lastCombo:S.lastCombo}));
  }catch(e){ /* storage unavailable — session-only */ }
}
function saveRows(){ /* async, only on import/remove/replace */
  const rawRows=S.rows.map(r=>{ const o={}; for(const k in r) if(!DERIVED.has(k)) o[k]=r[k]; o.__src=r._src; return o; });
  return idbPut('rows',rawRows).then(()=>{ S.rowsPersisted=true; })
    .catch(()=>{ S.rowsPersisted=false; });
}
function hydrateRows(rawRows){
  const counters={};
  S.rows=rawRows.map(r=>{ const src=r.__src; const {__src,...rest}=r;
    counters[src]=(counters[src]||0); return deriveRow(rest,src,counters[src]++); });
}
async function load(){
  try{
    const d=JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if(d){
      S.sources=d.sources||[]; S.negatives=d.negatives||[]; S.sameWords=d.sameWords||[];
      S.ui={...S.ui,...(d.ui||{}),tab:'select'}; srcSeq=d.srcSeq||1;
      S.lastCombo=d.lastCombo||{match:null,scope:null};
      if(d.rows&&d.rows.length){          // legacy localStorage rows → migrate to IDB
        hydrateRows(d.rows);
        saveRows(); save();               // save() drops the rows key from LS
        return;
      }
    }
  }catch(e){ /* corrupt meta — start fresh */ }
  try{
    const rawRows=await idbGet('rows');
    if(rawRows&&rawRows.length){ hydrateRows(rawRows); S.rowsPersisted=true; }
    else if(S.sources.length){ S.rowsPersisted=false; }
  }catch(e){ if(S.sources.length) S.rowsPersisted=false; }
}
function wipeAll(){
  S.sources=[]; S.rows=[]; S.negatives=[]; S.sameWords=[]; S.drafts={};
  S.lastCombo={match:null,scope:null};
  S.ui={...S.ui,search:'',srcOff:[],acctOff:[],minImpr:0,activeNgrams:[],hideBlocked:false};
  closeExpand(false); exitBatch(false); rowsVer++; negVer++; srcSeq=1;
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  idbDel('rows');
  const s=document.getElementById('search'); if(s) s.value='';
}

/* ════════════════ Derived data — cached, minimal recompute ════════════════
   Per-keystroke work is filter-only:
   - blocked map recomputed ONLY when negatives or rows change (negVer/rowsVer)
   - sort order cached per (key, dir, rowsVer) — filters reuse it
   - ngram aggregation moved out of the hot path; built lazily when the
     N-gram sheet opens                                                     */
let filteredRows=[], blockedSet=new Set(), ngramList=[];
let impact={all:null,blocked:null,bySrc:[]};
let rowsVer=0, negVer=0;
let blockedAll=new Map(), blockedNegVer=-1, blockedRowsVer=-1;
function ensureBlocked(){
  if(blockedNegVer===negVer&&blockedRowsVer===rowsVer) return;
  blockedAll=new Map();
  if(S.negatives.length){
    const bySrc={};
    for(const n of S.negatives) (bySrc[n.srcId]=bySrc[n.srcId]||[]).push(n);
    for(const r of S.rows){ const negs=bySrc[r._src]; if(negs&&rowBlockedByNegatives(r,negs)) blockedAll.set(r._id,true); }
  }
  blockedNegVer=negVer; blockedRowsVer=rowsVer;
}
let sortCache={key:'',dir:'',ver:-1,arr:[]};
function ensureSorted(){
  const k=S.ui.sort, dir=S.ui.dir;
  if(sortCache.key===k&&sortCache.dir===dir&&sortCache.ver===rowsVer) return sortCache.arr;
  const d=dir==='asc'?1:-1;
  const arr=S.rows.slice().sort((a,b)=> k==='kw' ? a._kwLower.localeCompare(b._kwLower)*(d*-1||1)
                                                : ((a[k]||0)-(b[k]||0))*d );
  sortCache={key:k,dir,ver:rowsVer,arr};
  return arr;
}
function recompute(){
  ensureBlocked();
  const q=S.ui.search.trim().toLowerCase();
  const srcOff=new Set(S.ui.srcOff), acctOff=new Set(S.ui.acctOff);
  const ngToks=S.ui.activeNgrams.map(n=>n.split(' '));
  const zero=()=>({rows:0,impr:0,clicks:0,conv:0,cost:0});
  const acc=(t,r)=>{ t.rows++; t.impr+=r.impr; t.clicks+=r.clicks; t.conv+=r.conv; t.cost+=r.cost; };
  const all=zero(), blk=zero(), srcMap=new Map();
  blockedSet=new Set();
  const out=[];
  for(const r of ensureSorted()){
    if(srcOff.has(r._src)) continue;
    if(acctOff.has(r._acct)) continue;
    if(r.impr<S.ui.minImpr) continue;
    if(q && !r._kwLower.includes(q) && !String(r['Campaign']||'').toLowerCase().includes(q)) continue;
    if(ngToks.length && !ngToks.some(t=>textContainsNgram(r._tok,t))) continue;
    acc(all,r);
    const isB=blockedAll.has(r._id);
    if(isB){
      blockedSet.add(r._id); acc(blk,r);
      let t=srcMap.get(r._src); if(!t){ t=zero(); srcMap.set(r._src,t); } acc(t,r);
      if(S.ui.hideBlocked) continue;
    }
    out.push(r);
  }
  impact={all,blocked:blk,bySrc:[...srcMap.entries()]};
  filteredRows=out;
}

/* ════════════════ Rendering ════════════════ */
const $=id=>document.getElementById(id);
const el=(tag,cls,txt)=>{ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; };
const srcName=id=>{ const s=S.sources.find(x=>x.id===id); return s?s.name:id; };
const srcShort=id=>srcName(id).replace(/\.csv$/i,'').slice(0,26);
const fmt=n=>n.toLocaleString();
const fmtC=n=>'$'+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(a,b)=>b?((a/b*100).toFixed(1)+'%'):'—';
const comboLabel=c=>(c.match==='Exact'?'Ex':c.match==='Phrase'?'Ph':'Br')+'\u00B7'+(c.scope==='CAM'?'Ca':c.scope==='AG'?'AG':'Cu');

function toast(msg){
  $('toastMsg').textContent=msg; $('toastUndo').classList.remove('on');
  const t=$('toast'); t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),1900);
}
function toastUndo(msg,fn){
  $('toastMsg').textContent=msg;
  const u=$('toastUndo'); u.classList.add('on');
  u.onclick=()=>{ fn(); $('toast').classList.remove('on'); };
  const t=$('toast'); t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),4200);
}

/* — Commit helper: push, sticky combo, undo — */
function commitNegatives(added,combo,label){
  if(!added.length){ toast('nothing new — already committed'); return; }
  S.negatives.push(...added); negVer++;
  if(combo) S.lastCombo={match:combo.match||null,scope:combo.scope||null};
  save(); recompute(); refreshAll();
  toastUndo('+'+added.length+' negative row'+(added.length!==1?'s':'')+(label?' \u2192 '+label:''),()=>{
    const set=new Set(added);
    S.negatives=S.negatives.filter(n=>!set.has(n)); negVer++;
    save(); recompute(); refreshAll();
  });
}

/* — Virtual list: fixed-height absolute rows, one inline expansion — */
const ROW_H=64, OVERSCAN=12;
const vlist=$('vlist'), vinner=$('vinner');
let rendered=new Map();
let expandedId=null, expandH=0, expPanel=null, expNeedCenter=false;

function expIndex(){ return expandedId ? filteredRows.findIndex(r=>r._id===expandedId) : -1; }

function renderVList(){
  let expIdx=expIndex();
  if(expandedId&&expIdx<0){ closeExpand(false); expIdx=-1; }
  vinner.style.height=(filteredRows.length*ROW_H+(expIdx>=0?expandH:0))+'px';
  const st=vlist.scrollTop, h=vlist.clientHeight||600;
  const pad=expIdx>=0?Math.ceil(expandH/ROW_H):0;
  const start=Math.max(0,Math.floor(st/ROW_H)-OVERSCAN-pad);
  const end=Math.min(filteredRows.length,Math.ceil((st+h)/ROW_H)+OVERSCAN);
  const want=new Set();
  for(let i=start;i<end;i++) want.add(i);
  for(const [i,node] of rendered) if(!want.has(i)){ node.remove(); if(node._bg)node._bg.remove(); rendered.delete(i); }
  const q=S.ui.search.trim().toLowerCase();
  const topOf=i=>i*ROW_H+(expIdx>=0&&i>expIdx?expandH:0);
  for(let i=start;i<end;i++){
    let card=rendered.get(i);
    if(!card){
      const r=filteredRows[i];
      card=el('div','rowcard'); card._rid=r._id;
      if(blockedSet.has(r._id)) card.classList.add('blocked');
      const d=S.drafts[r._id]; if(d&&(d.neg.length||d.mw.length)) card.classList.add('drafted');
      if(r._id===expandedId) card.classList.add('open');
      if(selSet.has(r._id)) card.classList.add('sel');
      const kwEl=el('div','rc-kw');
      const kw=r['Negative keyword']||'';
      if(q&&r._kwLower.includes(q)){
        const at=r._kwLower.indexOf(q);
        kwEl.append(kw.slice(0,at)); kwEl.append(el('span','hl',kw.slice(at,at+q.length))); kwEl.append(kw.slice(at+q.length));
      } else kwEl.textContent=kw;
      card.append(kwEl);
      card.append(el('div','rc-meta',r._acct+' · '+(r['Campaign']||'')+(r['Ad group']?' · '+r['Ad group']:'')));
      const nums=el('div','rc-nums');
      nums.innerHTML='<span><b>'+fmt(r.impr)+'</b> impr</span><span><b>'+fmt(r.conv)+'</b> conv</span><span><b>'+fmt(r.clicks)+'</b> clk</span>';
      card.append(nums);
      attachRowGestures(card,r);
      vinner.appendChild(card); rendered.set(i,card);
    }
    card.style.top=topOf(i)+'px';
    if(card._bg) card._bg.style.top=card.style.top;
  }
  // expansion panel placement
  if(expIdx>=0){
    if(!expPanel){ expPanel=el('div','exp'); vinner.appendChild(expPanel); renderExpPanel(); }
    expPanel.style.top=((expIdx+1)*ROW_H)+'px';
    const hNow=expPanel.offsetHeight;
    if(hNow&&hNow!==expandH){ expandH=hNow; renderVList(); return; }
    if(expNeedCenter){ expNeedCenter=false; centerExpand(expIdx); }
  } else if(expPanel){ expPanel.remove(); expPanel=null; }
  if(!filteredRows.length&&!vinner.querySelector('.emptymsg')){
    const m=el('div','emptymsg', S.rows.length ? 'No rows match. Broaden the search or filters.' :
      (S.sources.length&&!S.rowsPersisted ? 'Rows from your last session couldn\u2019t be restored. Re-upload on the Files tab \u2014 committed negatives are saved.' :
      'No data loaded. Add Candidate-Negatives CSV files on the Files tab.'));
    vinner.appendChild(m);
  }
}
function centerExpand(expIdx){
  const vh=vlist.clientHeight||600;
  const block=ROW_H+expandH, rowTop=expIdx*ROW_H;
  let target = block>=vh-20 ? rowTop-10 : rowTop-(vh-block)/2;
  vlist.scrollTo({top:Math.max(0,target),behavior:'smooth'});
}
function toggleExpand(id){
  if(expandedId===id){ closeExpand(true); return; }
  expandedId=id; expandH=0; expNeedCenter=true;
  if(expPanel){ expPanel.remove(); expPanel=null; }
  rendered.forEach(n=>{ n.remove(); if(n._bg)n._bg.remove(); }); rendered.clear();
  renderVList();
}
function closeExpand(rerender){
  expandedId=null; expandH=0;
  if(expPanel){ expPanel.remove(); expPanel=null; }
  if(rerender){ rendered.forEach(n=>{ n.remove(); if(n._bg)n._bg.remove(); }); rendered.clear(); renderVList(); }
}
let vRaf=null;
vlist.addEventListener('scroll',()=>{ if(vRaf) return; vRaf=requestAnimationFrame(()=>{ vRaf=null; renderVList(); }); },{passive:true});

/* — Row gestures: tap = expand (or toggle in batch mode);
     long-press = enter batch multi-select;
     left-swipe = one-gesture quick add of the FULL term with last combo — */
let selMode=false, selSet=new Set();
const SWIPE_COMMIT=-72, LP_MS=420;
function attachRowGestures(card,r){
  let sx=0,sy=0,axis=null,dx=0,lpT=null,suppress=false;
  const reset=()=>{ card.style.transform=''; if(card._bg){ card._bg.remove(); card._bg=null; } };
  card.addEventListener('touchstart',e=>{
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; axis=null; dx=0; suppress=false;
    lpT=setTimeout(()=>{ lpT=null; suppress=true;
      if(navigator.vibrate) navigator.vibrate(12);
      enterBatch(r._id);
    },LP_MS);
  },{passive:true});
  card.addEventListener('touchmove',e=>{
    const t=e.touches[0]; dx=t.clientX-sx; const dy=t.clientY-sy;
    if(axis===null&&(Math.abs(dx)>8||Math.abs(dy)>8)){
      axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
      if(lpT){ clearTimeout(lpT); lpT=null; }
    }
    if(axis==='x'&&!selMode){
      dx=Math.max(-120,Math.min(0,dx));
      if(!card._bg){
        const bg=el('div','swipebg','+ NEG · '+comboLabel(S.lastCombo));
        bg.style.top=card.style.top; card._bg=bg;
        vinner.insertBefore(bg,card);
      }
      card.style.transform='translateX('+dx+'px)';
    }
  },{passive:true});
  card.addEventListener('touchend',()=>{
    if(lpT){ clearTimeout(lpT); lpT=null; }
    if(axis==='x'){
      suppress=true;
      if(dx<=SWIPE_COMMIT&&!selMode) quickAdd(r);
      reset();
    }
    if(axis==='y') suppress=true;
    setTimeout(()=>{ suppress=false; },50);
    card._sup=suppress;
  },{passive:true});
  card.addEventListener('touchcancel',()=>{ if(lpT){ clearTimeout(lpT); lpT=null; } reset(); });
  card.addEventListener('contextmenu',e=>{ e.preventDefault(); enterBatch(r._id); });  // desktop fallback
  card.addEventListener('click',()=>{
    if(card._sup){ card._sup=false; return; }
    if(selMode){ toggleSel(r._id); return; }
    toggleExpand(r._id);
  });
}
function quickAdd(r){
  const text=(r['Negative keyword']||'').trim(); if(!text) return;
  const item={text,match:S.lastCombo.match,scope:S.lastCombo.scope};
  const sameSrc=S.rows.filter(x=>x._src===r._src);
  const expanded=expandNegatives(item,r,sameSrc).map(n=>({...n,srcId:r._src}));
  commitNegatives(dedupeNegatives(S.negatives,expanded),S.lastCombo,srcShort(r._src));
}

/* — Batch multi-select (long-press → contextual action bar) — */
const batch={match:null,scope:null};
function enterBatch(id){
  closeExpand(false);
  if(!selMode){ selMode=true; batch.match=S.lastCombo.match; batch.scope=S.lastCombo.scope; }
  selSet.add(id);
  renderBatchBar(); syncSelClasses();
}
function toggleSel(id){
  if(selSet.has(id)) selSet.delete(id); else selSet.add(id);
  if(!selSet.size){ exitBatch(true); return; }
  renderBatchBar(); syncSelClasses();
}
function exitBatch(rerender){
  selMode=false; selSet=new Set();
  $('batchBar').classList.remove('on');
  if(rerender) syncSelClasses();
}
function syncSelClasses(){
  rendered.forEach(n=>n.classList.toggle('sel',selSet.has(n._rid)));
}
function renderBatchBar(){
  $('batchBar').classList.add('on');
  $('bbCount').textContent=fmt(selSet.size);
  $('bbExact').classList.toggle('on',batch.match==='Exact');
  $('bbPhrase').classList.toggle('on',batch.match==='Phrase');
  $('bbCam').classList.toggle('on',batch.scope==='CAM');
  $('bbAg').classList.toggle('on',batch.scope==='AG');
}
$('bbExact').onclick=()=>{ batch.match=batch.match==='Exact'?null:'Exact'; renderBatchBar(); };
$('bbPhrase').onclick=()=>{ batch.match=batch.match==='Phrase'?null:'Phrase'; renderBatchBar(); };
$('bbCam').onclick=()=>{ batch.scope=batch.scope==='CAM'?null:'CAM'; renderBatchBar(); };
$('bbAg').onclick=()=>{ batch.scope=batch.scope==='AG'?null:'AG'; renderBatchBar(); };
$('bbAll').onclick=()=>{ filteredRows.forEach(r=>selSet.add(r._id)); renderBatchBar(); syncSelClasses(); };
$('bbX').onclick=()=>exitBatch(true);
$('bbAdd').onclick=()=>{
  if(!selSet.size) return;
  const byId=new Map(S.rows.map(r=>[r._id,r]));
  const srcRows=new Map();
  let expanded=[];
  for(const id of selSet){
    const r=byId.get(id); if(!r) continue;
    const text=(r['Negative keyword']||'').trim(); if(!text) continue;
    if(!srcRows.has(r._src)) srcRows.set(r._src,S.rows.filter(x=>x._src===r._src));
    expanded.push(...expandNegatives({text,match:batch.match,scope:batch.scope},r,srcRows.get(r._src)).map(n=>({...n,srcId:r._src})));
  }
  const added=dedupeNegatives(S.negatives,expanded);
  exitBatch(false);
  commitNegatives(added,{match:batch.match,scope:batch.scope},selSetLabel());
};
function selSetLabel(){ return 'batch'; }

/* — Inline expansion panel (word-level selection, unchanged options) — */
function getDraft(id){ return S.drafts[id]||(S.drafts[id]={neg:[],mw:[],match:null,scope:null}); }
function renderExpPanel(){
  const r=S.rows.find(x=>x._id===expandedId); if(!r||!expPanel) return;
  const d=getDraft(r._id);
  const body=expPanel; body.innerHTML='';
  body.addEventListener('click',e=>e.stopPropagation());

  const nav=el('div','exp-nav');
  const g=el('a',null,'Google'); g.target='_blank'; g.rel='noopener';
  g.href='https://www.google.com/search?q='+encodeURIComponent(r['Negative keyword']||'').replace(/%20/g,'+');
  const idx=expIndex();
  const prev=el('button',null,'\u2039'); prev.disabled=idx<=0;
  prev.onclick=()=>jumpExpand(idx-1);
  const next=el('button',null,'\u203A'); next.disabled=idx>=filteredRows.length-1;
  next.onclick=()=>jumpExpand(idx+1);
  nav.append(g,prev,next); body.append(nav);
  body.append(el('div','exp-meta',String(r['Customer ID']||'')+(S.sources.length>1?' · '+srcShort(r._src):'')+' · '+fmtC(r.cost)));

  const negChips=el('div','chips'); negChips.style.marginTop='4px';
  r._words.forEach(w=>{
    const c=el('button','chip'+(d.neg.includes(w)?' on':''),w);
    c.onclick=()=>{ d.neg=d.neg.includes(w)?d.neg.filter(x=>x!==w):[...d.neg,w];
      if(!d.neg.length){d.match=null;d.scope=null;} rerenderExp(); };
    negChips.append(c);
  });
  if(r._words.length){
    const allOn=d.neg.length===r._words.length&&r._words.every(w=>d.neg.includes(w));
    const all=el('button','chip all'+(allOn?' on':''),'all+');
    all.onclick=()=>{ d.neg=allOn?[]:[...r._words]; if(!d.neg.length){d.match=null;d.scope=null;} rerenderExp(); };
    negChips.append(all);
  }
  body.append(negChips);

  const seg=el('div','seg'); seg.style.marginTop='8px';
  [['Exact','Ex'],['Phrase','Ph']].forEach(([v,label])=>{
    const b=el('button','tgl sm'+(d.match===v?' on':''),label);
    b.onclick=()=>{ d.match=d.match===v?null:v; rerenderExp(); }; seg.append(b);
  });
  [['CAM','Ca'],['AG','AG']].forEach(([v,label])=>{
    const b=el('button','tgl sm'+(d.scope===v?' on':''),label);
    b.onclick=()=>{ d.scope=d.scope===v?null:v; rerenderExp(); }; seg.append(b);
  });
  if(S.lastCombo.match||S.lastCombo.scope){
    const lc=el('button','lastchip','\u27F2 '+comboLabel(S.lastCombo));
    lc.onclick=()=>{ d.match=S.lastCombo.match; d.scope=S.lastCombo.scope; rerenderExp(); };
    seg.append(lc);
  }
  body.append(seg);

  if(r._mwords.length){
    body.append(el('div','exp-div'));
    body.append(el('div','sh-label','Same words'));
    const mChips=el('div','chips');
    r._mwords.forEach(w=>{
      const c=el('button','chip mchip'+(d.mw.includes(w)?' on':''),w);
      c.onclick=()=>{ d.mw=d.mw.includes(w)?d.mw.filter(x=>x!==w):[...d.mw,w]; rerenderExp(); };
      mChips.append(c);
    });
    const allOn=d.mw.length===r._mwords.length&&r._mwords.every(w=>d.mw.includes(w));
    const all=el('button','chip mchip all'+(allOn?' on':''),'all+');
    all.onclick=()=>{ d.mw=allOn?[]:[...r._mwords]; rerenderExp(); };
    mChips.append(all);
    body.append(mChips);
  }

  body.append(el('div','sh-preview',d.neg.length?('\u2192 '+d.neg.join(' ')+(d.match?' ['+d.match+']':' [Broad]')+(d.mw.length?'  :  '+d.mw.join(' '):'')):''));

  const acts=el('div','exp-actions');
  const bNeg=el('button','abtn primary','+ Neg'); bNeg.disabled=!d.neg.length;
  bNeg.onclick=()=>addNegative(r);
  const bSame=el('button','abtn match','+ Same'); bSame.disabled=!(d.neg.length&&d.mw.length);
  bSame.onclick=()=>addSameWords(r);
  const bSkip=el('button','abtn skip','Skip \u203A');
  bSkip.onclick=()=>{
    delete S.drafts[r._id];
    const idx=expIndex();
    if(idx+1<filteredRows.length) jumpExpand(idx+1); else closeExpand(true);
  };
  acts.append(bNeg,bSame,bSkip);
  body.append(acts);
}
function jumpExpand(idx){
  if(idx<0||idx>=filteredRows.length) return;
  expandedId=filteredRows[idx]._id; expandH=0; expNeedCenter=true;
  if(expPanel){ expPanel.remove(); expPanel=null; }
  rendered.forEach(n=>{ n.remove(); if(n._bg)n._bg.remove(); }); rendered.clear();
  renderVList();
}
function rerenderExp(){
  renderExpPanel();
  const idx=expIndex();
  if(idx>=0&&expPanel){
    const hNow=expPanel.offsetHeight;
    if(hNow&&hNow!==expandH){ expandH=hNow; renderVList(); }
  }
}
function addNegative(r){
  const d=getDraft(r._id); if(!d.neg.length) return;
  const text=d.neg.join(' ').trim(); if(!text) return;
  const combo={match:d.match,scope:d.scope};
  d.neg=[]; d.match=null; d.scope=null;
  const idxB=expIndex();
  const nextId=(idxB>=0&&idxB+1<filteredRows.length)?filteredRows[idxB+1]._id:null;
  const sameSrc=S.rows.filter(x=>x._src===r._src);
  const expanded=expandNegatives({text,match:combo.match,scope:combo.scope},r,sameSrc).map(n=>({...n,srcId:r._src}));
  closeExpand(false);
  commitNegatives(dedupeNegatives(S.negatives,expanded),combo,srcShort(r._src));
  // advance: reopen on the next row (or same slot if the row was hidden/removed)
  let target=null;
  if(nextId&&filteredRows.some(x=>x._id===nextId)) target=nextId;
  else if(filteredRows.length&&idxB>=0) target=filteredRows[Math.min(idxB,filteredRows.length-1)]._id;
  if(target){
    expandedId=target; expandH=0; expNeedCenter=true;
    rendered.forEach(n=>{ n.remove(); if(n._bg)n._bg.remove(); }); rendered.clear();
    renderVList();
  }
}
function addSameWords(r){
  const d=getDraft(r._id);
  const left=d.neg.join(' ').trim(), right=d.mw.join(' ').trim();
  if(!left||!right) return;
  const key=r._src+'||'+left+'||'+right;
  if(!S.sameWords.some(p=>p.srcId+'||'+p.left+'||'+p.right===key)){
    S.sameWords.push({srcId:r._src,left,right});
    toast('+ same words pair');
  } else toast('duplicate pair — skipped');
  d.mw=[];
  save(); renderBadges(); rerenderExp();   // stays open so + Negative can follow
}

  const p=$('negPane'); p.innerHTML='';
  if(!S.negatives.length){ p.append(el('div','emptymsg','No negatives yet.')); return; }
  const bySrc=new Map();
  S.negatives.forEach((n,i)=>{ if(!bySrc.has(n.srcId)) bySrc.set(n.srcId,[]); bySrc.get(n.srcId).push({n,i}); });
  for(const [srcId,items] of bySrc){
    const card=el('div','card');
    const h=el('div','card-h');

    const dl=el('button','dl','\u2B07 CSV');
    dl.onclick=()=>downloadNegativesFor(srcId);
    h.append(dl); card.append(h);
    const LIMIT=60;
    const shown=card._exp?items:items.slice(0,LIMIT);
    shown.forEach(({n,i})=>{
      const row=el('div','itemrow');
      const main=el('div','main');
      main.append(el('span','kw',n.negativeKeyword),el('span',null,' '));
      const t=n.type==='Exact match'?'ex':n.type==='Phrase match'?'ph':'br';
      main.append(Object.assign(el('span','tag '+t),{textContent:n.type.replace(' match','')}));
      main.append(el('div','sub',n.customerId+' · '+n.campaign+(n.adGroup?' · '+n.adGroup:'')));
      row.append(main);
      const x=el('button','xbtn','\u00D7');
      x.onclick=()=>{ S.negatives.splice(i,1); negVer++; save(); recompute(); refreshAll(); };
      row.append(x); card.append(row);
    });
    if(items.length>LIMIT&&!card._exp){
      const m=el('button','more','show all '+items.length+' \u2193');
      m.onclick=()=>{ card._exp=true; renderNegPane(); };
      card.append(m);
    }
    p.append(card);
  }
  const clr=el('button','dangerbtn','Clear all negatives');
  clr.onclick=()=>{ if(confirm('Delete all committed negatives?')){ S.negatives=[]; negVer++; save(); recompute(); refreshAll(); } };

function downloadNegativesFor(srcId){
  const rows=S.negatives.filter(n=>n.srcId===srcId);
  if(!rows.length) return;
  const headers=['Row Type','Action','Customer ID','Campaign','Ad group','Negative keyword','Type'];
  const csv=[headers.join(',')].concat(rows.map(r=>
    [r.rowType,r.action,r.customerId,r.campaign,r.adGroup,r.negativeKeyword,r.type].map(csvEsc).join(','))).join('\n');
  const base=srcName(srcId).replace(/\.csv$/i,'');
  triggerDownload(new Blob([csv],{type:'text/csv;charset=utf-8'}),'negatives-'+base+'-'+new Date().toISOString().slice(0,10)+'.csv');
}

  if(S.sources.length||S.negatives.length||S.sameWords.length){
    const wipe=el('button','dangerbtn','Clear all data (uploads, negatives, pairs, saved session)');
    wipe.onclick=()=>{ if(confirm('Wipe everything, including the saved session on this device?')){ wipeAll(); recompute(); refreshAll(); toast('cleared'); } };
    p.append(wipe);
  }
}
async function handleFiles(files){
  let added=0, dupes=0;
  const seenKeys=new Set(S.rows.map(rawKey));
  for(const f of files){
    if(!/\.csv$/i.test(f.name)&&f.type!=='text/csv') continue;
    try{
      const text=await f.text();
      const raw=parseCSVText(text);
      const usable=raw.filter(r=>String(r['Negative keyword']||'').trim());
      if(!usable.length){ toast('No "Negative keyword" column rows in '+f.name); continue; }
      const id='s'+(srcSeq++);
      let kept=0;
      usable.forEach(r=>{
        const k=rawKey(r);
        if(seenKeys.has(k)){ dupes++; return; }   // drop the duplicate, keep the original
        seenKeys.add(k);
        S.rows.push(deriveRow(r,id,kept)); kept++;
      });
      if(!kept){ srcSeq--; toast(f.name+': all rows were duplicates of loaded data'); continue; }
      S.sources.push({id,name:f.name,addedAt:Date.now(),rowCount:kept});
      added++;
    }catch(e){ toast('Failed to read '+f.name); }
  }
  if(added||dupes){
    rowsVer++;
    save(); saveRows(); recompute(); refreshAll();
  }
  if(added){
    toast('+'+added+' file'+(added>1?'s':'')+' loaded'+(dupes?' \u00B7 '+dupes+' dupe row'+(dupes>1?'s':'')+' dropped':''));
    setTab('select');
  }
}

/* — Tabs / refresh — */
function setTab(t){
  S.ui.tab=t;
  if(t!=='select') exitBatch(false);
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  ['select','negatives','same','files'].forEach(x=>$('pane-'+x).classList.toggle('on',x===t));
  refreshAll();
}
document.querySelectorAll('.tabbar button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
function refreshAll(){
  renderBadges();
  if(S.ui.tab==='select'){
    renderStatline();
    rendered.forEach(n=>{ n.remove(); if(n._bg)n._bg.remove(); }); rendered.clear();
    if(expPanel){ expPanel.remove(); expPanel=null; }
    vinner.querySelectorAll('.emptymsg').forEach(n=>n.remove());
    if(expandedId){ expandH=0; }
    renderVList();
    if(expandedId&&expIndex()>=0){ renderVList(); }
    if(selMode) renderBatchBar();
  }
  if(S.ui.tab==='negatives') renderNegPane();
  if(S.ui.tab==='same') renderSamePane();
  if(S.ui.tab==='files') renderFilesPane();
}
let searchT=null;
$('search').addEventListener('input',e=>{
  clearTimeout(searchT);
  searchT=setTimeout(()=>{ S.ui.search=e.target.value; save(); recompute(); refreshAll(); },160);
});
window.addEventListener('resize',()=>{ if(S.ui.tab==='select') renderVList(); });

/* — Boot (async: rows hydrate from IndexedDB) — */
(async()=>{
  await load();
  $('search').value=S.ui.search||'';
  recompute();
  setTab(S.rows.length?'select':'files');
})();
</script>
